name: Apply brand and caption fix

on:
  push:
    branches:
      - codex/brand-dot-caption-layout

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/brand-dot-caption-layout
      - name: Apply requested copy and article layout changes
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('js/app.js')
          text = app.read_text()
          replacements = {
              'home: "JazzingFfm",': 'home: "JazzingFfm.",',
              'contact: "Contact JazzingFfm"': 'contact: "Contact"',
              'eyebrow: "ABOUT JAZZINGFFM",': 'eyebrow: "ABOUT JAZZINGFFM.",',
              'text: "JazzingFfm captures local musicians beyond jazz, artists and thought leaders shaping Frankfurt’s culture. Documenting the real and the best from the scene today. Portraits in noir and interviews about music, life, and more."': 'text: "JazzingFfm. captures local musicians beyond jazz, artists and thought leaders shaping Frankfurt’s culture. Documenting the real and the best from the scene today. Portraits in noir and interviews about music, life, and more."',
              'eyebrow: "CONTACT JAZZINGFFM",': 'eyebrow: "CONTACT JAZZINGFFM.",',
              'text: "Interview requests, collaboration ideas, comments or love messages — contact JazzingFfm here:"': 'text: "Interview requests, collaboration ideas, comments or love messages — contact JazzingFfm. here:"',
              'support: "support JazzingFfm"': 'support: "support JazzingFfm."',
              'contact: "JazzingFfm kontaktieren"': 'contact: "Kontakt"',
              'eyebrow: "ÜBER JAZZINGFFM",': 'eyebrow: "ÜBER JAZZINGFFM.",',
              'text: "JazzingFfm porträtiert lokale Musiker:innen über den Jazz hinaus, Künstler:innen und Vordenker:innen, die Frankfurts Kultur prägen. Dokumentiert wird das Echte und Beste aus der Szene von heute. Porträts in Noir und Interviews über Musik, Leben und mehr."': 'text: "JazzingFfm. porträtiert lokale Musiker:innen über den Jazz hinaus, Künstler:innen und Vordenker:innen, die Frankfurts Kultur prägen. Dokumentiert wird das Echte und Beste aus der Szene von heute. Porträts in Noir und Interviews über Musik, Leben und mehr."',
              'eyebrow: "JAZZINGFFM KONTAKTIEREN",': 'eyebrow: "JAZZINGFFM. KONTAKTIEREN",',
              'text: "Interview-Anfragen, Kollaborationsideen, Kommentare oder Liebesnachrichten – schreib JazzingFfm hier:"': 'text: "Interview-Anfragen, Kollaborationsideen, Kommentare oder Liebesnachrichten – schreib JazzingFfm. hier:"',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected app.js text: {old}')
              text = text.replace(old, new)
          app.write_text(text)

          index = Path('index.html')
          html = index.read_text()
          html_replacements = {
              '<title>JazzingFfm</title>': '<title>JazzingFfm.</title>',
              'aria-label="JazzingFfm on Instagram"': 'aria-label="JazzingFfm. on Instagram"',
              'aria-label="JazzingFfm home"': 'aria-label="JazzingFfm. home"',
              'alt="JazzingFfm"': 'alt="JazzingFfm."',
              '>JazzingFfm</a>': '>JazzingFfm.</a>',
              '>Contact us</a>': '>Contact</a>',
              '<div id="homeEyebrow" class="eyebrow">About JazzingFfm</div>': '<div id="homeEyebrow" class="eyebrow">ABOUT JAZZINGFFM.</div>',
              'JazzingFfm captures local musicians beyond jazz, artists and thought leaders': 'JazzingFfm. captures local musicians beyond jazz, artists and thought leaders',
              '<div id="contactEyebrow" class="eyebrow">Contact us</div>': '<div id="contactEyebrow" class="eyebrow">CONTACT JAZZINGFFM.</div>',
              'For interview requests, collaboration ideas, concert tips or corrections,\n            contact JazzingFfm here:': 'Interview requests, collaboration ideas, comments or love messages —\n            contact JazzingFfm. here:',
              '>support JazzingFfm</a>': '>support JazzingFfm.</a>',
              'css/style.css?v=copy33': 'css/style.css?v=brand34',
              'js/app.js?v=copy33': 'js/app.js?v=brand34',
          }
          for old, new in html_replacements.items():
              if old not in html:
                  raise SystemExit(f'Missing expected index.html text: {old}')
              html = html.replace(old, new)
          index.write_text(html)

          css = Path('css/style.css')
          styles = css.read_text()
          marker = '/* article caption + counter row — PR 34 */'
          if marker not in styles:
              styles += '''\n\n/* article caption + counter row — PR 34 */\n.article-gallery .gallery-status {\n  position: absolute;\n  top: calc(100% + 8px);\n  right: 0;\n  bottom: auto;\n  left: auto;\n  margin: 0;\n  padding: 0;\n  color: var(--muted);\n  font-size: 14px;\n  line-height: 1.4;\n  text-align: right;\n  white-space: nowrap;\n}\n\n#articleCaption.caption {\n  margin: 8px 86px 10px 0;\n  color: var(--muted);\n  font-size: 14px;\n  line-height: 1.4;\n  min-height: 1.4em;\n}\n\n#articleBody.article-body {\n  margin-top: 10px;\n}\n\n#articleBody.article-body > :first-child {\n  margin-top: 0;\n}\n\n@media (max-width: 700px) {\n  .article-gallery .gallery-status,\n  #articleCaption.caption {\n    font-size: 13px;\n  }\n\n  #articleCaption.caption {\n    margin-right: 64px;\n    margin-bottom: 8px;\n  }\n\n  #articleBody.article-body {\n    margin-top: 8px;\n  }\n}\n'''
          css.write_text(styles)
          PY
      - name: Verify JavaScript
        run: node --check js/app.js
      - name: Commit focused changes and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-brand-caption-fix.yml
          git add js/app.js css/style.css index.html
          git commit -m "Refine JazzingFfm branding and article captions"
          git push origin HEAD:codex/brand-dot-caption-layout
