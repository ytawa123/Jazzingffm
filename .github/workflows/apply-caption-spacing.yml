name: Apply caption spacing
on:
  push:
    branches:
      - codex/article-caption-flush-row
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/article-caption-flush-row
      - name: Tighten caption row and add article text gap
        shell: bash
        run: |
          cat >> css/style.css <<'EOF'

/* flush article caption + counter row */
.article-gallery .gallery-status {
  top: 100%;
}

#articleCaption.caption {
  margin-top: 0;
  margin-bottom: 0;
}

#articleBody.article-body {
  margin-top: 20px;
}

@media (max-width: 700px) {
  #articleCaption.caption {
    margin-top: 0;
    margin-bottom: 0;
  }

  #articleBody.article-body {
    margin-top: 16px;
  }
}
EOF
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('css/style.css?v=spacing35', 'css/style.css?v=caption36')
          s = s.replace('css/style.css?v=brand34', 'css/style.css?v=caption36')
          p.write_text(s)
          PY
      - name: Commit focused changes and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/apply-caption-spacing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/style.css index.html .github/workflows/apply-caption-spacing.yml
          git commit -m "Place article captions flush under photos"
          git push origin codex/article-caption-flush-row
