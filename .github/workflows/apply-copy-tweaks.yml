name: Apply copy tweaks

on:
  push:
    branches:
      - codex/copy-contact-home-tweaks

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/copy-contact-home-tweaks

      - name: Apply requested copy and color changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('js/app.js')
          app = app_path.read_text()

          replacements = {
              'contact: "Contact us"': 'contact: "Contact JazzingFfm"',
              'eyebrow: "About JazzingFfm"': 'eyebrow: "ABOUT JAZZINGFFM"',
              'eyebrow: "Contact us"': 'eyebrow: "CONTACT JAZZINGFFM"',
              'text: "For interview requests, collaboration ideas, concert tips or corrections, contact JazzingFfm here:"': 'text: "Interview requests, collaboration ideas, comments or love messages — contact JazzingFfm here:"',
              'contact: "Kontakt"': 'contact: "JazzingFfm kontaktieren"',
              'eyebrow: "Über JazzingFfm"': 'eyebrow: "ÜBER JAZZINGFFM"',
              'eyebrow: "Kontakt"': 'eyebrow: "JAZZINGFFM KONTAKTIEREN"',
              'text: "Für Interview-Anfragen, Kooperationsideen, Konzerttipps oder Korrekturen erreichst du JazzingFfm hier:"': 'text: "Interview-Anfragen, Kollaborationsideen, Kommentare oder Liebesnachrichten – schreib JazzingFfm hier:"',
          }
          for old, new in replacements.items():
              if app.count(old) != 1:
                  raise SystemExit(f'Expected exactly one occurrence of: {old!r}; got {app.count(old)}')
              app = app.replace(old, new, 1)
          app_path.write_text(app)

          css_path = Path('css/style.css')
          css = css_path.read_text()
          old = '''    .home-about-copy > p {\n      color: var(--muted);'''
          new = '''    .home-about-copy > p {\n      color: var(--ink);'''
          if css.count(old) != 1:
              raise SystemExit(f'Expected home about paragraph color block once; got {css.count(old)}')
          css = css.replace(old, new, 1)
          css_path.write_text(css)

          index_path = Path('index.html')
          index = index_path.read_text()
          if 'css/style.css?v=gallery29' not in index or 'js/app.js?v=gallery29' not in index:
              raise SystemExit('Expected current cache keys')
          index = index.replace('css/style.css?v=gallery29', 'css/style.css?v=copy33', 1)
          index = index.replace('js/app.js?v=gallery29', 'js/app.js?v=copy33', 1)
          index_path.write_text(index)
          PY

      - name: Verify JavaScript
        run: node --check js/app.js

      - name: Commit focused changes
        run: |
          rm .github/workflows/apply-copy-tweaks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js css/style.css index.html .github/workflows/apply-copy-tweaks.yml
          git commit -m "Refine homepage and contact copy"
          git push origin codex/copy-contact-home-tweaks
