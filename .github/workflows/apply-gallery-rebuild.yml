name: Apply gallery rebuild

on:
  push:
    branches:
      - codex/gallery-state-rebuild

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/gallery-state-rebuild
      - name: Apply gallery rebuild
        run: python .github/gallery_rebuild.py
      - name: Verify JavaScript
        run: node --check js/app.js
      - name: Commit gallery rebuild
        run: |
          rm -f .github/gallery_rebuild.py
          rm -f .github/workflows/rebuild-gallery.yml
          rm -f .github/workflows/apply-gallery-rebuild.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make article gallery switch slides explicitly"
          git push origin codex/gallery-state-rebuild
