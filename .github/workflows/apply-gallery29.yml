name: Apply gallery fade test

on:
  push:
    branches:
      - codex/gallery-slide-transition

permissions:
  contents: write

jobs:
  patch-gallery:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/gallery-slide-transition

      - name: Apply gallery fade and test images
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Make the gallery frame larger, invisible, and keep full images contained.
          css_path = Path('css/style.css')
          css = css_path.read_text()
          old_track = '''    .article-gallery-track {
      aspect-ratio: 16 / 9;
      background: transparent;
      border: 1.5px solid var(--ink);
      display: block;
      overflow: hidden;
      position: relative;
      width: 100%;
    }'''
          new_track = '''    .article-gallery-track {
      aspect-ratio: 3 / 2;
      background: transparent;
      border: 0;
      display: block;
      overflow: hidden;
      position: relative;
      width: 100%;
    }'''
          if css.count(old_track) != 1:
              raise SystemExit('Expected one gallery track block')
          css = css.replace(old_track, new_track, 1)
          css_path.write_text(css)

          # Replace horizontal movement with a clear fade-out / fade-in sequence.
          js_path = Path('js/app.js')
          js = js_path.read_text()
          pattern = r'''      function showSlide\(index, direction\) \{.*?\n      \}\n\n      galleryPrevious\.onclick'''
          replacement = '''      function showSlide(index) {
        if (isAnimating || slideCount < 1) {
          return;
        }

        const nextIndex = (index + slideCount) % slideCount;
        if (nextIndex === activeIndex) {
          return;
        }

        const currentSlide = slides[activeIndex];
        const nextSlide = slides[nextIndex];

        if (reduceMotion || typeof currentSlide.animate !== "function") {
          setVisibleSlide(nextIndex);
          return;
        }

        isAnimating = true;

        const fadeOut = currentSlide.animate(
          [
            { opacity: 1 },
            { opacity: 0 }
          ],
          {
            duration: 240,
            easing: "ease-in",
            fill: "forwards"
          }
        );

        fadeOut.finished.then(function() {
          currentSlide.hidden = true;
          currentSlide.setAttribute("aria-hidden", "true");

          activeIndex = nextIndex;
          nextSlide.hidden = false;
          nextSlide.setAttribute("aria-hidden", "false");

          const fadeIn = nextSlide.animate(
            [
              { opacity: 0 },
              { opacity: 1 }
            ],
            {
              duration: 320,
              easing: "ease-out",
              fill: "forwards"
            }
          );

          fadeIn.finished.then(function() {
            currentSlide.getAnimations().forEach(function(animation) {
              animation.cancel();
            });
            nextSlide.getAnimations().forEach(function(animation) {
              animation.cancel();
            });
            updateStatus();
            isAnimating = false;
          });
        });
      }

      galleryPrevious.onclick'''
          js, count = re.subn(pattern, lambda _: replacement, js, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected one showSlide replacement, got {count}')
          js = js.replace('showSlide(activeIndex - 1, -1);', 'showSlide(activeIndex - 1);')
          js = js.replace('showSlide(activeIndex + 1, 1);', 'showSlide(activeIndex + 1);')
          js_path.write_text(js)

          # Replace Leo Mori placeholders with four random internet cat images
          # using different requested source dimensions for gallery testing.
          leo_path = Path('articles/leo-mori.js')
          leo = leo_path.read_text()
          old_images = '''        images: [
          "images/leo-mori/kenny1.jpg",
          "images/leo-mori/kenny2.jpg",
          "images/leo-mori/kenny3.jpg",
          "images/leo-mori/kenny4.jpg"
        ],'''
          new_images = '''        images: [
          "https://cataas.com/cat?width=1600&gallery=leo-test-1",
          "https://cataas.com/cat?height=1200&gallery=leo-test-2",
          "https://cataas.com/cat?type=square&gallery=leo-test-3",
          "https://cataas.com/cat?width=720&gallery=leo-test-4"
        ],'''
          if leo.count(old_images) != 1:
              raise SystemExit('Expected Leo Mori image array once')
          leo = leo.replace(old_images, new_images, 1)
          leo_path.write_text(leo)

          # Force browsers to load the updated gallery assets.
          index_path = Path('index.html')
          index = index_path.read_text()
          if index.count('css/style.css?v=gallery28') != 1:
              raise SystemExit('Expected gallery28 CSS cache key')
          if index.count('js/app.js?v=gallery28') != 1:
              raise SystemExit('Expected gallery28 JS cache key')
          index = index.replace('css/style.css?v=gallery28', 'css/style.css?v=gallery29', 1)
          index = index.replace('js/app.js?v=gallery28', 'js/app.js?v=gallery29', 1)
          index_path.write_text(index)
          PY

      - name: Verify JavaScript
        run: node --check js/app.js

      - name: Commit focused update
        run: |
          rm .github/workflows/apply-gallery29.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/style.css js/app.js articles/leo-mori.js index.html .github/workflows/apply-gallery29.yml
          git commit -m "Use fade gallery with contained cat test images"
          git push origin codex/gallery-slide-transition
