name: Apply listing spacing
on:
  push:
    branches:
      - codex/listing-header-balanced-spacing
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Balance listing header spacing
        run: |
          python - <<'PY'
          from pathlib import Path
          css = Path('css/style.css')
          text = css.read_text()
          old = '''    .listing {\n      padding: 50px 0 70px;\n    }\n\n    .listing-header {\n      display: flex;\n      align-items: end;\n      justify-content: flex-start;\n      gap: 56px;\n      margin-bottom: 16px;\n    }\n\n    .listing-header + .thin-line {\n      margin: 14px 0 44px;\n    }'''
          new = '''    .listing {\n      padding: 18px 0 70px;\n    }\n\n    .listing-header {\n      display: flex;\n      align-items: end;\n      justify-content: flex-start;\n      gap: 56px;\n      margin-bottom: 0;\n    }\n\n    .listing-header + .thin-line {\n      margin: 18px 0 44px;\n    }'''
          if old not in text:
              raise SystemExit('expected listing CSS block not found')
          css.write_text(text.replace(old, new, 1))

          html = Path('index.html')
          text = html.read_text()
          text = text.replace('css/style.css?v=brand34', 'css/style.css?v=spacing35')
          html.write_text(text)
          PY
      - name: Commit focused changes and remove helper workflow
        run: |
          rm .github/workflows/apply-listing-spacing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/style.css index.html .github/workflows/apply-listing-spacing.yml
          git commit -m "Balance listing header spacing"
          git push
