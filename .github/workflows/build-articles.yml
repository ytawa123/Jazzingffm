name: Build article content

on:
  push:
    paths:
      - "content/articles/**"
      - "images/**"
      - "scripts/build_site.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: article-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate article registry and pages
        run: python scripts/build_site.py

      - name: Commit generated files when needed
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Generated article files are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/articles.js data/generated-article-pages.json articles interviews features
          git commit -m "Build article pages [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
