name: Refresh site polish assets
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cache-bust-site-polish.yml
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Refresh asset versions
        shell: bash
        run: |
          sed -i 's#css/site-polish.css?v=2#css/site-polish.css?v=3#' index.html
          sed -i 's#js/site-transition.js?v=1#js/site-transition.js?v=2#' index.html
      - name: Commit and clean up
        shell: bash
        run: |
          rm .github/workflows/cache-bust-site-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/cache-bust-site-polish.yml
          git commit -m "Refresh transition and homepage image assets"
          git push origin main
