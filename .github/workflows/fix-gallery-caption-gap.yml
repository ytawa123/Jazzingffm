name: Fix gallery caption gap
on:
  push:
    branches:
      - codex/fix-gallery-caption-gap
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-gallery-caption-gap
      - name: Fix gallery geometry
        shell: bash
        run: |
          printf '%s\n' '' '/* Make the slide fill the invisible gallery frame and keep the photo bottom flush with its caption. */' '.article-hero-image {' '  height: 100% !important;' '  align-items: end;' '}' '' '.article-gallery .gallery-status {' '  top: 100%;' '}' '' '#articleCaption.caption {' '  margin-top: 0;' '  margin-bottom: 0;' '}' '' '#articleBody.article-body {' '  margin-top: 20px;' '}' '' '@media (max-width: 700px) {' '  #articleBody.article-body {' '    margin-top: 16px;' '  }' '}' >> css/style.css
          sed -i -E 's#css/style.css\?v=[^\"]+#css/style.css?v=caption37#' index.html
      - name: Commit focused fix and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/fix-gallery-caption-gap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/style.css index.html .github/workflows/fix-gallery-caption-gap.yml
          git commit -m "Fix gallery caption gap under photos"
          git push origin codex/fix-gallery-caption-gap
