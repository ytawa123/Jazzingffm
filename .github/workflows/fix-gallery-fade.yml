name: Fix gallery fade transition

on:
  push:
    branches:
      - codex/gallery-fade-transition-fix

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/gallery-fade-transition-fix

      - name: Apply robust fade transition
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css_path = Path('css/style.css')
          css = css_path.read_text()
          old_track = '''    .article-gallery-track {
      aspect-ratio: 3 / 2;
      background: transparent;
      border: 0;
      display: block;
      overflow: hidden;
      position: relative;
      width: 100%;
    }'''
          new_track = '''    .article-gallery-track {
      aspect-ratio: 3 / 2;
      background: transparent;
      border: 0;
      display: block;
      opacity: 1;
      overflow: hidden;
      position: relative;
      transition: opacity 420ms ease;
      width: 100%;
    }

    .article-gallery-track.is-fading {
      opacity: 0;
    }'''
          if css.count(old_track) != 1:
              raise SystemExit('Expected one gallery track block')
          css = css.replace(old_track, new_track, 1)
          css_path.write_text(css)

          js_path = Path('js/app.js')
          js = js_path.read_text()
          pattern = r'''      function showSlide\(index\) \{.*?\n      \}\n\n      galleryPrevious\.onclick'''
          replacement = '''      function showSlide(index) {
        if (isAnimating || slideCount < 1) {
          return;
        }

        const nextIndex = (index + slideCount) % slideCount;
        if (nextIndex === activeIndex) {
          return;
        }

        isAnimating = true;
        const fadeDuration = reduceMotion ? 140 : 420;

        articleGalleryTrack.style.transitionDuration = fadeDuration + "ms";
        articleGalleryTrack.classList.add("is-fading");

        window.setTimeout(function() {
          setVisibleSlide(nextIndex);

          requestAnimationFrame(function() {
            requestAnimationFrame(function() {
              articleGalleryTrack.classList.remove("is-fading");

              window.setTimeout(function() {
                isAnimating = false;
              }, fadeDuration + 40);
            });
          });
        }, fadeDuration + 40);
      }

      galleryPrevious.onclick'''
          js, count = re.subn(pattern, lambda _: replacement, js, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected one showSlide function, got {count}')
          js_path.write_text(js)

          index_path = Path('index.html')
          index = index_path.read_text()
          if index.count('css/style.css?v=gallery29') != 1:
              raise SystemExit('Expected gallery29 CSS cache key')
          if index.count('js/app.js?v=gallery29') != 1:
              raise SystemExit('Expected gallery29 JS cache key')
          index = index.replace('css/style.css?v=gallery29', 'css/style.css?v=gallery30', 1)
          index = index.replace('js/app.js?v=gallery29', 'js/app.js?v=gallery30', 1)
          index_path.write_text(index)
          PY

      - name: Verify JavaScript
        run: node --check js/app.js

      - name: Commit focused fix
        run: |
          rm .github/workflows/fix-gallery-fade.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/style.css js/app.js index.html .github/workflows/fix-gallery-fade.yml
          git commit -m "Make gallery fade transition reliable"
          git push origin codex/gallery-fade-transition-fix
