name: Fix Leo Mori gallery

on:
  push:
    branches:
      - codex/fix-leo-gallery

permissions:
  contents: write

jobs:
  fix-gallery:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-leo-gallery

      - name: Patch gallery
        env:
          PATCH_SCRIPT_B64: 
        run: |
          printf '%s' "$PATCH_SCRIPT_B64" | base64 --decode > /tmp/patch.py
          python /tmp/patch.py

      - name: Verify JavaScript
        run: node --check js/app.js

      - name: Commit focused fix
        run: |
          rm .github/workflows/fix-leo-gallery.yml
          rm -f .github/trigger-gallery.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/style.css js/app.js index.html .github/workflows/fix-leo-gallery.yml .github/trigger-gallery.txt
          git commit -m "Fix Leo Mori photo gallery"
          git push origin codex/fix-leo-gallery
