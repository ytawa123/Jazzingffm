name: Fix mobile read interview button

'on':
  push:
    branches: ["codex/mobile-read-interview-nowrap"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mobile-read-interview-nowrap

      - name: Keep mobile button text on one line
        run: |
          python3 -c "from pathlib import Path; p=Path('css/style.css'); s=p.read_text(); old='      .latest-button-mobile {\\n        display: inline-flex;\\n        justify-self: start;\\n        order: 3;\\n      }'; new='      .latest-button-mobile {\\n        display: inline-flex;\\n        justify-self: start;\\n        order: 3;\\n        white-space: nowrap;\\n      }'; assert s.count(old) == 1, s.count(old); p.write_text(s.replace(old, new, 1))"

      - name: Commit focused change
        run: |
          rm .github/workflows/fix-mobile-read-interview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/style.css .github/workflows/fix-mobile-read-interview.yml
          git commit -m "Keep mobile interview button on one line"
          git push origin codex/mobile-read-interview-nowrap
