name: Patch interview tagline

on:
  push:
    branches:
      - codex/interview-tagline

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/interview-tagline

      - name: Update interview page copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '''    .listing-header p {\n      max-width: 540px;\n      font-size: 20px;\n      color: var(--muted);\n      margin: 0;\n    }''',
                  '''    .listing-header p {\n      max-width: 540px;\n      font-size: 20px;\n      color: var(--muted);\n      margin: 0;\n      white-space: pre-line;\n    }''',
              ),
              (
                  '''          <p id="listingDescription">\n            Conversations and portraits of musicians, artists,\n            and thought leaders shaping the scene — jazz and beyond.\n          </p>''',
                  '''          <p id="listingDescription">\n            --\n            <br />\n            Jazz and beyond.\n          </p>''',
              ),
              (
                  '            description: "Conversations and portraits of musicians, artists, and thought leaders shaping the scene — jazz and beyond."',
                  '            description: "--\\nJazz and beyond."',
              ),
              (
                  '            description: "Gespräche mit und Porträts von Musiker, Künstler und Vordenker, die die Szene prägen – Jazz und darüber hinaus."',
                  '            description: "--\\nJazz und darüber hinaus."',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit focused change
        shell: bash
        run: |
          rm .github/workflows/patch-interview-tagline.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/patch-interview-tagline.yml
          git commit -m "Shorten interview page tagline"
          git push origin HEAD:codex/interview-tagline
