name: Patch mobile interview button

on:
  push:
    branches:
      - codex/mobile-read-interview-nowrap

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mobile-read-interview-nowrap

      - name: Prevent arrow wrapping
        run: |
          test "$(grep -c '^[[:space:]]*\.latest-button-mobile {' css/style.css)" -ge 1
          perl -0pi -e 's/(\.latest-button-mobile \{\n        display: inline-flex;\n        justify-self: start;\n        order: 3;\n)(      \})/$1        white-space: nowrap;\n$2/' css/style.css
          grep -A5 '\.latest-button-mobile {' css/style.css | grep -q 'white-space: nowrap;'

      - name: Commit CSS fix
        run: |
          rm -f .github/workflows/fix-mobile-read-interview.yml
          rm -f .github/workflows/patch-mobile-button-simple.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/style.css .github/workflows/
          git commit -m "Keep mobile interview arrow beside text"
          git push origin codex/mobile-read-interview-nowrap
