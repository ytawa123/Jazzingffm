name: Rebuild article gallery

on:
  push:
    branches:
      - codex/gallery-state-rebuild

permissions:
  contents: write

jobs:
  rebuild-gallery:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/gallery-state-rebuild

      - name: Rebuild gallery navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          js_path = Path('js/app.js')
          js = js_path.read_text()

          replacement = r'''    function renderArticleGallery(article, copy) {
      const galleryImages =
        Array.isArray(article.images) && article.images.length
          ? article.images
          : article.image
            ? [article.image]
            : [];

      articleGalleryTrack.innerHTML = "";
      const galleryRoot = articleGalleryTrack.parentElement;
      let galleryStatus = galleryRoot.querySelector(".gallery-status");

      if (!galleryStatus) {
        galleryStatus = document.createElement("div");
        galleryStatus.className = "gallery-status";
        galleryStatus.setAttribute("aria-live", "polite");
        galleryRoot.appendChild(galleryStatus);
      }

      if (galleryImages.length) {
        galleryImages.forEach(function(imagePath, index) {
          const slide = document.createElement("div");
          const image = document.createElement("img");

          slide.className = "article-hero-image has-photo";
          slide.hidden = index !== 0;
          image.src = imagePath;
          image.alt =
            article.cardTitle[currentLang] +
            " \u2014 photo " +
            (index + 1) +
            " of " +
            galleryImages.length;
          image.loading = index === 0 ? "eager" : "lazy";

          image.addEventListener("error", function() {
            slide.classList.remove("has-photo");
            slide.textContent =
              article.imageLabel[currentLang] + " (" + imagePath + ")";
            image.remove();
          });

          slide.appendChild(image);
          articleGalleryTrack.appendChild(slide);
        });
      } else {
        const placeholder = document.createElement("div");
        placeholder.className = "article-hero-image";
        placeholder.textContent = article.imageLabel[currentLang];
        articleGalleryTrack.appendChild(placeholder);
      }

      const slides = Array.from(articleGalleryTrack.children);
      const slideCount = slides.length;
      const hasMultiplePhotos = slideCount > 1;
      let activeIndex = 0;

      galleryPrevious.hidden = !hasMultiplePhotos;
      galleryNext.hidden = !hasMultiplePhotos;
      galleryStatus.hidden = !hasMultiplePhotos;
      galleryPrevious.setAttribute("aria-label", copy.article.previousPhoto);
      galleryNext.setAttribute("aria-label", copy.article.nextPhoto);

      function showSlide(index) {
        activeIndex = (index + slideCount) % slideCount;

        slides.forEach(function(slide, slideIndex) {
          slide.hidden = slideIndex !== activeIndex;
          slide.setAttribute("aria-hidden", slideIndex === activeIndex ? "false" : "true");
        });

        galleryStatus.textContent = activeIndex + 1 + " / " + slideCount;
      }

      galleryPrevious.onclick = function(event) {
        event.preventDefault();
        showSlide(activeIndex - 1);
      };

      galleryNext.onclick = function(event) {
        event.preventDefault();
        showSlide(activeIndex + 1);
      };

      let touchStartX = null;

      articleGalleryTrack.ontouchstart = function(event) {
        touchStartX = event.touches[0].clientX;
      };

      articleGalleryTrack.ontouchend = function(event) {
        if (touchStartX === null || !hasMultiplePhotos) {
          touchStartX = null;
          return;
        }

        const swipeDistance = touchStartX - event.changedTouches[0].clientX;

        if (swipeDistance > 40) {
          showSlide(activeIndex + 1);
        } else if (swipeDistance < -40) {
          showSlide(activeIndex - 1);
        }

        touchStartX = null;
      };

      showSlide(0);
    }

    function renderArticle(slug) {'''

          pattern = r'    function renderArticleGallery\(article, copy\) \{.*?\n    function renderArticle\(slug\) \{'
          js, count = re.subn(pattern, replacement, js, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected one gallery function replacement, got {count}')
          js_path.write_text(js)

          css_path = Path('css/style.css')
          css = css_path.read_text()

          start = css.index('    .article-gallery-track {')
          end = css.index('    .caption {', start)
          gallery_css = '''    .article-gallery-track {
      display: block;
      overflow: hidden;
      width: 100%;
    }

    .article-hero-image {
      border: 1.5px solid var(--ink);
      min-height: 560px;
      background:
        radial-gradient(circle at 25% 25%, rgba(255,255,255,.13), transparent 32%),
        linear-gradient(135deg, rgba(255,255,255,.09), rgba(255,255,255,.02)),
        repeating-linear-gradient(
          45deg,
          rgba(255,255,255,.10) 0 1px,
          transparent 1px 20px
        );
      color: var(--muted);
      display: flex;
      align-items: flex-end;
      font-size: 16px;
      overflow: hidden;
      padding: 24px;
      width: 100%;
    }

    .article-hero-image[hidden] {
      display: none;
    }

    .article-hero-image img {
      display: block;
      height: auto;
      object-fit: contain;
      width: 100%;
    }

    .article-hero-image.has-photo {
      align-items: flex-start;
      min-height: 0;
      padding: 0;
    }

    .gallery-control {
      background: transparent;
      border: 0;
      color: #fff;
      cursor: pointer;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 30px;
      line-height: 1;
      opacity: 0;
      padding: 10px;
      pointer-events: none;
      position: absolute;
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.85);
      top: 50%;
      transform: translateY(-50%);
      transition: opacity 0.16s ease;
      z-index: 2;
    }

    .article-gallery:hover .gallery-control,
    .article-gallery:focus-within .gallery-control {
      opacity: 1;
      pointer-events: auto;
    }

    .gallery-control:hover {
      color: #fff;
      opacity: 0.65;
    }

    .gallery-control.previous {
      left: 8px;
    }

    .gallery-control.next {
      right: 8px;
    }

    .gallery-control[hidden],
    .gallery-status[hidden] {
      display: none;
    }

    .gallery-status {
      background: rgba(5, 5, 5, 0.72);
      bottom: 12px;
      color: #fff;
      font-size: 13px;
      line-height: 1;
      padding: 6px 8px;
      pointer-events: none;
      position: absolute;
      right: 12px;
      z-index: 2;
    }

    @media (hover: none), (pointer: coarse) {
      .article-gallery .gallery-control {
        opacity: 1;
        pointer-events: auto;
      }
    }

'''
          css = css[:start] + gallery_css + css[end:]

          old_mobile = '''      .article-hero-image,
      .feature-image {
        height: 380px;
        min-height: 380px;
      }'''
          new_mobile = '''      .feature-image {
        height: 380px;
        min-height: 380px;
      }

      .article-hero-image {
        height: auto;
        min-height: 0;
      }'''
          if old_mobile not in css:
              raise SystemExit('Mobile gallery sizing block not found')
          css = css.replace(old_mobile, new_mobile, 1)
          css_path.write_text(css)

          index_path = Path('index.html')
          index = index_path.read_text()
          index = re.sub(r'css/style\.css\?v=[^"\']+', 'css/style.css?v=gallery27', index, count=1)
          index = re.sub(r'js/app\.js\?v=[^"\']+', 'js/app.js?v=gallery27', index, count=1)
          index_path.write_text(index)
          PY

      - name: Verify JavaScript
        run: node --check js/app.js

      - name: Commit focused gallery fix
        run: |
          rm .github/workflows/rebuild-gallery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js css/style.css index.html .github/workflows/rebuild-gallery.yml
          git commit -m "Rebuild article gallery navigation"
          git push origin codex/gallery-state-rebuild
